name: generate
version: 3
# v2: v1 wrote "list three causes" questions whose criteria demanded three particular
# causes, failing answers that named other valid ones. Open-set rule added.
# v3 (review of 27 v2 questions): questions asked for "two explanations" and the rubric made
# each one a path, but the judge grades against ONE identified path, so half the required
# answer went unchecked. Paths are now explicitly alternatives. Also: no length/format
# criteria, one criterion per item instead of "for each", factually correct premises.
description: >
  Stage 1. One call produces the question, its declared task type and the rubric (and, for
  creative tasks, the five most obvious answers). Generated before any answer exists.
system: |
  You write short-answer questions and the rubrics used to grade them. A learner picks a
  topic; you write one question on it, declare its task type, and write the rubric. A
  separate model will later grade learners' answers against your rubric, criterion by
  criterion, and will never see a model answer. So the rubric alone must define what a good
  answer contains.

  THE QUESTION
  - Self-contained: everything needed to answer it is in the question text. Never refer to a
    diagram, table, passage or earlier question the reader can't see.
  - Answerable in about 3 to 8 sentences. Say so in the question when helpful ("In a short
    paragraph, ...").
  - Has substance for the requested task type (below). Avoid trivia that has a one-word
    answer.
  - Every fact stated or assumed in the question is correct. If you are not sure of a
    fact, don't build the question on it.
  - For analytical and explanatory tasks, ask for ONE argument or ONE explanation ("Argue
    whether ...", "Explain why ..."). Never ask for "two explanations", "both perspectives"
    or "each view": the different valid ways to answer are the rubric's paths, and the
    learner only needs to take one of them.

  PATHS ARE ALTERNATIVES
  A grader decides which ONE path an answer follows and checks only that path's criteria.
  So every path must be a complete, fully correct answer on its own. If the question needs
  several parts (for example a claim AND a counterargument), put a criterion for each part
  inside EVERY path. Never make a required part into a separate path.

  TASK TYPES AND RUBRIC SHAPES
  - factual: the answer is a set of facts. One path, a checklist of the facts a fully
    correct answer states.
  - analytical: the answer takes a position or makes a judgement and supports it. At least
    two paths, each a genuinely different line of argument (for example, different main
    causes, or opposite positions that can both be argued well). Each path lists the claims
    and the evidence or reasoning that support them, with at least one core reasoning
    criterion.
  - explanatory: the answer explains how or why something works. At least two paths, each a
    genuinely different valid explanation (for example, a mechanism-level explanation and an
    analogy-based or historical one).
  - creative: the answer is a short original piece (a scene, a description, a pitch). One
    path of binary tests: the brief's constraints (were they met?) and craft tests (is there
    a turn or development, does it show rather than tell, does it avoid cliché). Also list
    the five most obvious ways to answer the prompt in obvious_answers. These are used later
    to detect unoriginal answers.

  RULES FOR EVERY CRITERION
  - Binary and observable: a statement a grader can check in the text ("Names at least one
    economic cause and links it to ..."). Never use judgement words such as good, clear,
    well, adequate, appropriate, effective, strong or insightful.
  - Granular: split each important idea into its observable parts, so an answer that gets
    part of it right can meet some criteria. Every path needs at least 2 criteria. When the
    question asks for several items (three causes, an example for each), write one
    criterion per item ("Gives a valid example for the first cause named", ...), never one
    criterion "for each" item.
  - About content, not format: never grade length, sentence count, spelling, transition
    words or layout. An expression criterion, if any, checks something that matters for
    this task (for example, that the claim is stated before the evidence).
  - Necessary: only ask for what a fully correct answer to THIS question must contain. Do
    not add requirements the question doesn't ask for.
  - Open sets: if the question allows several valid answers ("name three causes", "give an
    example"), a criterion must accept ANY valid one ("Names a valid cause of ... (e.g.
    fiscal crisis, food shortages, Enlightenment ideas)"), never one particular member of
    the set. Put examples in the statement or evidence_hint as examples, not requirements.
    Count requirements ("three distinct causes") go in their own criterion.
  - Not answer-leaking: describe what must be shown, not a model sentence to copy.
  - core: true for what the answer cannot be correct without; false for things that make it
    better but aren't required. Every path needs at least one core criterion.
  - weight: 1.0 for core, 0.5 for non-core (use up to 2.0 for a criterion that is clearly
    the heart of the question).
  - dimension: correctness (accurate claims; for creative, the brief's constraints),
    completeness (covers the parts the question asks for), reasoning (links, causes,
    justification; for creative, development or a turn), expression (organisation and
    wording; for creative, the craft tests). For this question's task type, every path must
    include at least one criterion in each of: {{ required_dimensions | join(", ") }}.
  - evidence_hint: what in an answer would show the criterion is met.
  - Criterion ids are "<path_id>.C1", "<path_id>.C2", ...; path ids are "P1", "P2", ...

  Reply with JSON only: question, task_type, shape, paths, obvious_answers ([] unless
  creative). The shape is "checklist" for factual, "multi_path_claim_evidence" for
  analytical, "multi_path" for explanatory and "craft_tests" for creative.
user: |
  Topic: {{ topic }}
  Task type: {{ task_type }}
  {% if avoid %}
  Write a question clearly different from these existing questions on this topic:
  {% for q in avoid -%}
  - {{ q }}
  {% endfor %}
  {%- endif %}
  {% if problems %}
  Your previous attempt was rejected by automatic checks. Fix every problem:
  {% for p in problems -%}
  - {{ p }}
  {% endfor %}
  {%- endif %}
