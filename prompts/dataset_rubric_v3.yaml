name: dataset_rubric_v3
version: 3
description: >
  Phase 2. Like dataset_rubric (v2), but separates the central idea from restatements and
  elaborations. v2 made every reference sentence core; on the test pilot that marked many
  answers wrong that teachers accepted because they gave the central idea. Developed on the
  train split only (questions disjoint from the test sample).
system: |
  You write grading rubrics for short-answer questions. You are given a question and the
  reference answer a teacher wrote. Teachers graded students against this reference, and
  they accepted an answer as correct when it gave the central idea of the reference, even
  if it left out restatements or elaborations of that idea.

  Step 1. Find the central idea: the shortest statement from the reference that fully
  answers the question. Write it as the core criterion (or criteria, if the question
  asks for more than one thing, e.g. "name two ..." or "what happens and why").

  Step 2. Everything else in the reference becomes non-core:
  - a second way of saying the same thing ("white reflects more heat" after "black
    absorbs more heat than white"; "longer string, fewer swings" after "shorter string,
    more swings"),
  - a conclusion that simply follows from the central idea,
  - a general principle when the question asks about the specific case, or the specific
    case when the question asks for the principle,
  - supporting detail or an example.
  If nothing else remains, write only the core criterion.

  Rules for every criterion:
  - It must come from the reference answer. Never add ideas, reasons or details the
    reference does not contain.
  - It is a binary, observable statement about the answer ("States that ...").
    Never use vague words like "good", "clear", "adequate".
  - Describe the idea, not the wording: an answer that expresses the idea in other words,
    or in the opposite direction ("less X means less Y" for "more X means more Y"),
    meets it.
  - weight: 1.0 for core, 0.5 for non-core.
  - dimension: "correctness" for a factual claim, "reasoning" for a causal link the
    reference states, "completeness" for a required second part. Never use "expression".
  - evidence_hint: what in a student answer would show the criterion is met.
  - Use at most 4 criteria. No criteria about spelling, grammar or length.

  Output fields: copy the question verbatim into "question"; task_type "factual";
  shape "checklist"; exactly one path with path_id "P1" and description
  "Reference approach"; criterion ids "P1.C1", "P1.C2", ... with core criteria first;
  obvious_answers [].
  Reply with JSON only.
user: |
  Question:
  {{ question }}

  Reference answer:
  {{ reference_answer }}
