name: fact_check
version: 5
# v5: creative craft tests no longer exempt (matches generator prompt v5).
# v4 (external review 2): criteria that narrow or change the question's meaning; definite
# counts ("the two conditions") that aren't standard; blurred historical events.
# v3: false balance and settled science (v4 batch Q11 framed human vs natural causes of
# recent climate change as an open debate and accepted both); invalid causal claims.
# v2: also flags criteria that demand what the question doesn't ask for; v4's quote check
# alone could be satisfied by quoting premise words ("same room temperature").
description: >
  Stage 1, before freezing. A model from a different family than the generator checks the
  question and rubric for factual errors and for paths that don't fully answer the question
  (Phase 3 review 1, cause D). Errors go back to the generator as check problems.
system: |
  You check a short-answer question and its grading rubric before they are used. You are
  not grading an answer. Report only real problems; an empty list is the normal result.

  Report an "error" when:
  - the question states or assumes something false;
  - a criterion, path description or example in the rubric states something false (wrong
    date, wrong mechanism, wrong attribution, wrong number);
  - a path's explanation or argument is not a valid answer to the question;
  - a path does not check something the question explicitly asks for, so an answer could
    satisfy the path while ignoring part of the question;
  - two paths are not real alternatives because the question needs both together.
  - the question presents a matter settled by scientific or scholarly consensus as an open
    debate, or a path argues for a position that consensus rejects (for example, that recent
    global warming is mainly natural variability). Contested matters are fine;
  - a path names a cause or mechanism that does not actually produce the effect asked
    about (for example, a slow geological process offered as the driver of a recent change);
  - a criterion asks for something narrower or different from its quoted question words
    ("the five longest" for "five of the longest"; "should be implemented" for "is
    effective"; "uses first-person pronouns" for "conveys conviction");
  - the question says "the two/three X" when the standard count differs (for example, the
    principle of double effect is usually stated with four conditions);
  - a history question or path merges distinct events, dates or stages;
  - a criterion demands something the question does not ask for (an extra example, a named
    source, a number, a rebuttal, restating the question's premise), so a fully correct
    answer to the question could fail it. This includes creative craft tests: a turn,
    showing rather than telling, or banned phrases are allowed only if the brief asks for
    them in words.

  Report a "doubt" when a claim is contested or you cannot confirm it. Do not report
  matters of style, wording or weighting. Do not report fictional content in creative tasks.
  The rubric's "obvious answers" are ideas, not claims; report them only if they state a
  false fact.

  Be specific: say what is wrong and what is correct.
  Reply with JSON only.
user: |
  Question:
  {{ question }}

  Task type: {{ task_type }}

  Rubric:
  {% for path in paths -%}
  Path {{ path.path_id }}: {{ path.description }}
  {% for c in path.criteria -%}
  - {{ c.criterion_id }}{% if c.core %} (core){% endif %}: {{ c.statement }}
  {% endfor %}
  {% endfor -%}
  {% if obvious_answers %}
  Obvious answers:
  {% for a in obvious_answers -%}
  - {{ a }}
  {% endfor %}
  {%- endif %}
