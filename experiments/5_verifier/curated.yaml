  justification: This focuses on self-mythologising in the narration itself. A narrator describing his
    own rise is the source of the unreliability, which gives a direct link to doubts about self-made success
    that neither listed path draws.
  answer: Jay Gatsby is an unreliable narrator because he tells the story of his own rise from poverty.
    He boasts about his parties and his wealth throughout the novel. Since we only hear his version, we
    cannot be sure that any of his success was earned. This makes the reader doubt that hard work leads
    to success in America.
  note: 'False: Nick Carraway narrates the novel, not Gatsby. A basic factual error about the book, in
    the shape of a reasonable-sounding argument.'
