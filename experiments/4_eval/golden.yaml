# ---------------------------------------------------------------- analytical: WWI causes
- id: wwi-alliances
  question: 17c1b10632b5
  kind: good
  answer: >-
    The alliance system was the primary cause of the war. After Austria-Hungary declared war on
    Serbia in July 1914, Russia mobilised to protect Serbia, Germany declared war on Russia and
    on Russia's ally France, and Germany's invasion of Belgium brought in Britain under the 1839
    Treaty of London. A local Balkan crisis became a continental war within a week only because
    each power was bound to join its partners; without those commitments the conflict would
    likely have stayed between Austria-Hungary and Serbia.
  path: P1
  expect: {correctness: [0.85, 1], completeness: [1, 1], reasoning: [1, 1]}

- id: wwi-nationalism
  question: 17c1b10632b5
  kind: paraphrase
  answer: >-
    Nationalist rivalry, not the treaties, was what really started the war. Gavrilo Princip, a
    Bosnian Serb tied to the Black Hand group that wanted South Slavs freed from Habsburg rule,
    shot Archduke Franz Ferdinand in Sarajevo on 28 June 1914. Austria-Hungary was determined to
    crush Serbian nationalism, which it saw as a threat to its multi-ethnic empire, and Russia
    backed Serbia out of Pan-Slav feeling. The alliances only spread a fire that national hatreds
    had lit.
  path: P2
  expect: {correctness: [0.85, 1], completeness: [1, 1], reasoning: [1, 1]}

- id: wwi-partial
  question: 17c1b10632b5
  kind: partial
  answer: >-
    I think the alliances were the main cause. The countries had promised to help each other,
    so once one country went to war the others had to as well.
  path: P1
  expect: {correctness: [0.3, 0.6], completeness: [1, 1], reasoning: [0, 1]}

- id: wwi-wrong
  question: 17c1b10632b5
  kind: wrong
  answer: >-
    The alliance system was the main cause. In 1914 a Russian student assassinated Archduke
    Franz Ferdinand in Vienna, and because Italy and Germany were allied they immediately
    invaded France together. Britain then joined to defend its ally Russia.
  path: P1
  expect: {correctness: [0, 0.5]}

- id: wwi-off
  question: 17c1b10632b5
  kind: off_topic
  answer: >-
