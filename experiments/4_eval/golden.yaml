  kind: wrong
  answer: >-
    Heating air makes it denser and heavier, but the expanding gas pushes down hard on the
    basket like a rocket, which drives the balloon upward. Heat itself is a gas lighter than
    air, so it also carries the balloon up.
  path: P1
  expect: {correctness: [0, 0.5], reasoning: [0, 0.5]}

- id: balloon-off
