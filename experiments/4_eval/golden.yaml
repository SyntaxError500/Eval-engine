# ---------------------------------------------------------------- explanatory: hot-air balloon
- id: balloon-good
  question: 23575fb39cfd
  kind: good
  answer: >-
    Heating the air inside the envelope makes its molecules move faster and spread out, so the
    hot air is less dense than the cooler air surrounding the balloon. Because the balloon
    displaces outside air that is heavier than the air it contains, the surrounding air pushes
    up on it with a buoyant force. When that upward force exceeds the weight of the balloon,
    basket and hot air, the balloon rises.
  path: P1
  expect: {correctness: [0.85, 1], reasoning: [1, 1], completeness: [1, 1]}

- id: balloon-paraphrase
  question: 23575fb39cfd
  kind: paraphrase
  answer: >-
    Warm air weighs less than the same amount of cold air. The air outside the balloon stays
    cold, so the balloon full of warm air is lighter than the air around it. The heavier outside
    air pushes it upward, the same way water pushes a cork up to the surface.
  path: P1
  expect: {correctness: [0.85, 1], reasoning: [1, 1], completeness: [1, 1]}

- id: balloon-partial
  question: 23575fb39cfd
  kind: partial
  answer: >-
    Hot air rises, so when the burner heats the air inside the balloon, the balloon goes up
    with it. Turning the burner off makes it come back down.
  path: P1
  expect: {correctness: [0.3, 0.6], reasoning: [0, 0.5], completeness: [0, 0]}

- id: balloon-wrong
