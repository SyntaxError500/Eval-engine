# ---------------------------------------------------------------- factual: cell cycle
- id: cell-good
  question: 512f892a6afa
  kind: good
  answer: >-
    The cell cycle includes G1, S phase and M phase. In G1 the cell grows and produces the
    proteins and organelles it will need. During S phase the entire genome is replicated, so
    each chromosome ends up as two sister chromatids. In M phase (mitosis) the sister
    chromatids are pulled to opposite poles and the cell divides into two daughter cells.
  path: P1
  expect: {correctness: [0.85, 1], completeness: [1, 1]}

- id: cell-paraphrase
  question: 512f892a6afa
  kind: paraphrase
  answer: >-
    First comes the growth gap, where the cell simply gets bigger and builds up supplies. Next
    is the synthesis stage, when it makes a full copy of its genetic material. Last is the
    division stage, where the copies are split up and the cell pinches into two new cells.
  path: P1
  expect: {correctness: [0.85, 1], completeness: [1, 1]}

- id: cell-partial
  question: 512f892a6afa
  kind: partial
  answer: >-
    In G1 the cell grows and makes proteins. In S phase the DNA is copied so there are two
    complete sets. After that the cell gets ready to divide.
  path: P1
  expect: {correctness: [0.55, 0.8], completeness: [0, 0.5]}

- id: cell-wrong
  question: 512f892a6afa
  kind: wrong
  answer: >-
    In G1 the cell copies all of its DNA. In S phase the cell splits into two daughter cells.
    In M phase the cell rests and grows larger before the next round.
  path: P1
  expect: {correctness: [0.15, 0.6]}

- id: cell-off
