# ---------------------------------------------------------------- explanatory: rain shadow
- id: rain-good
  question: 3f8052a62a58
  kind: good
  answer: >-
    The main mechanism is orographic lift: moist air blown against a mountain range is forced
    upward, cools as it rises, and its water vapour condenses and falls as rain or snow on the
    windward slopes. After crossing the crest, the now-drier air descends the leeward side and
    warms by compression, which lowers its relative humidity so clouds evaporate and little
    precipitation falls. For example, the western Cascades receive over 2,000 mm of rain a year
    while parts of eastern Washington get under 250 mm.
  path: P1
  expect: {correctness: [0.85, 1], reasoning: [1, 1], completeness: [1, 1]}

- id: rain-paraphrase
  question: 3f8052a62a58
  kind: paraphrase
  answer: >-
    Wet wind from the sea hits the mountains and has to climb over them. As it climbs it gets
    colder and can't hold its water, so it dumps it as rain on the side facing the wind. When
    the air comes down the far side it heats up again and is now very dry, so it soaks up
    moisture instead of dropping any. That's why Death Valley, just east of the Sierra Nevada,
    is one of the driest places in North America.
  path: P1
  expect: {correctness: [0.85, 1], reasoning: [1, 1], completeness: [1, 1]}

- id: rain-partial
  question: 3f8052a62a58
  kind: partial
  answer: >-
    Rain shadows are caused by orographic lift. Moist air is pushed up the windward side of the
    mountains, where it cools and drops most of its moisture as rain.
  path: P1
  expect: {correctness: [0.85, 1], reasoning: [0, 0.5], completeness: [0, 0]}

- id: rain-wrong
  question: 3f8052a62a58
  kind: wrong
  answer: >-
    The leeward side is dry because the mountains block the sunlight, so less water evaporates
    there and fewer clouds can form. The Himalayas are dry on their southern side for this
    reason.
  path: P1
  expect: {correctness: [0, 0.5], reasoning: [0, 0.5]}

- id: rain-off
  question: 3f8052a62a58
  kind: off_topic
  answer: >-
    Monsoons happen because land heats up faster than the ocean in summer. The warm land draws
    in moist ocean air, which brings months of heavy rain to places like India.
  expect: {correctness: [0, 0.5], reasoning: [0, 0.5], completeness: [0, 0]}

# ---------------------------------------------------------------- analytical: work from home
- id: wfh-good
  question: 78d7767e5351
  kind: good
  answer: >-
    Working from home does increase overall work-life balance for most people. First, it
    removes the daily commute, giving many workers an extra hour or more each day for family,
    exercise or rest. Second, flexible hours let people fit work around school runs and
    appointments instead of choosing between them. Some find the boundaries harder to keep, but
    those costs are usually smaller than the time and control they gain.
  path: P1
  expect: {correctness: [0.85, 1], reasoning: [1, 1]}

- id: wfh-paraphrase
  question: 78d7767e5351
  kind: paraphrase
  answer: >-
