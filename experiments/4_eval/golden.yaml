# ---------------------------------------------------------------- factual: macronutrients
- id: macro-good
  question: 17b9d268178a
  kind: good
  answer: >-
    The three macronutrients are carbohydrates, proteins and fats. Carbohydrates are the body's
    main source of quick energy, especially for the brain and muscles. Proteins supply amino
    acids used to build and repair tissues such as muscle. Fats store energy long term and help
    the body absorb fat-soluble vitamins.
  path: P1
