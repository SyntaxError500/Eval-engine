# Dimension weights per task type. These are design choices, not measured quantities
# (design doc §12). Used internally for correlation/leniency only; never shown as an aggregate.
# Each row must sum to 1.0.
factual:     {correctness: 0.50, completeness: 0.30, reasoning: 0.10, expression: 0.10}
analytical:  {correctness: 0.20, completeness: 0.20, reasoning: 0.45, expression: 0.15}
explanatory: {correctness: 0.30, completeness: 0.25, reasoning: 0.30, expression: 0.15}
# creative: correctness = constraint satisfaction; expression = craft + originality
creative:    {correctness: 0.25, completeness: 0.15, reasoning: 0.10, expression: 0.50}
