# Role -> provider/model routing. Swapping a model for a role is a one-line change here.
#
# `family` is the model family (who trained it). The design requires the judge and verifier
# to come from a different family than the generator, and the verifier to differ from the
# amendment proposer; tests/test_config_and_prompts.py enforces this.
#
# Why this layout (no paid APIs; Mistral's API is not free):
#   - The judge runs on EVERY answer, so it sits on the largest free daily request budget:
#     Gemini 3.5 Flash Lite (500/day). Gemini Flash models allow only 20/day on the free tier.
#   - Generation runs once per question, so it fits Groq's small daily token cap.
#   - Groq limits are per model, so gpt-oss-120b and Qwen have separate budgets.
#
# Limits below were read from each console on 2026-10-28:
#   Gemini: https://aistudio.google.com/rate-limit
#   Groq:   https://console.groq.com/settings/limits
# Limits apply per provider+model; `model_limits` overrides the provider default for one
# model. A null limit means "not enforced".

providers:
  gemini:
    api_key_env: GEMINI_API_KEY
    # Default = Gemini Flash models (3.6 / 3.8 / 2.5 Flash all show 5 RPM, 20 RPD).
    limits: {rpm: 5, tpm: 250000, rpd: 20, tpd: null}
    model_limits:
      gemini-3.5-flash-lite: {rpm: 15, tpm: 250000, rpd: 500, tpd: null}
    rpd_reset_tz: America/Los_Angeles     # Gemini daily quota resets at midnight Pacific
  groq:
    api_key_env: GROQ_API_KEY
    # Confirmed in console.groq.com/settings/limits on 2026-10-28, for both gpt-oss-120b and
    # qwen/qwen3.8-27b (limits are per model).
    limits: {rpm: 30, tpm: 8000, rpd: 1000, tpd: 200000}
    model_limits:
      # Not on the limits page; Groq's 429 reports "output tokens per minute (OTPM): 1000".
      qwen/qwen3.8-27b: {rpm: 30, tpm: 8000, rpd: 1000, tpd: 200000, otpm: 1000}
    rpd_reset_tz: UTC
  ollama:
    api_key_env: null
    limits: {rpm: null, tpm: null, rpd: null, tpd: null}
    rpd_reset_tz: UTC
  # Adapter kept for a possible paid upgrade; no role uses it.
  mistral:
    api_key_env: MISTRAL_API_KEY
    limits: {rpm: null, tpm: null, rpd: null, tpd: null}
    rpd_reset_tz: UTC

roles:
  generator:
    provider: groq
    model: openai/gpt-oss-120b
    family: openai-oss
    temperature: 0.3              # 0.7 intermittently broke long nested JSON; variety comes from the avoid list
    max_output_tokens: 6000
    reasoning_effort: medium
    json_mode: strict               # non-strict schema mode garbled nested JSON; plain JSON mode degenerated into string lists
  reference_answer:
    provider: groq
    model: openai/gpt-oss-120b
    family: openai-oss
    temperature: 0.7
    max_output_tokens: 3000
    reasoning_effort: low
    json_mode: strict               # non-strict schema mode garbled nested JSON; plain JSON mode degenerated into string lists
  amendment_proposer:
    provider: groq
    model: openai/gpt-oss-120b
    family: openai-oss
    temperature: 0.3
    max_output_tokens: 3000
    reasoning_effort: medium
    json_mode: strict               # non-strict schema mode garbled nested JSON; plain JSON mode degenerated into string lists
  judge:
    provider: gemini
    # Pinned. Free-tier Flash models allow only 20 requests/day (the 302-item pilot alone
    # would take 15 days), and on 2026-10-28 the newest ones returned 503/504 under load.
    # Flash Lite allows 500/day. Whether its grading is good enough is the Phase 2 question.
    model: gemini-3.5-flash-lite
    family: google
    temperature: 0.0
    max_output_tokens: 4096
  verifier:
    provider: groq
    model: qwen/qwen3.8-27b
    family: qwen
    temperature: 0.0
    # Groq free tier caps this model at 1,000 OUTPUT tokens/min (not shown on the limits
    # page; returned as a 429). A larger max_tokens is rejected outright.
    max_output_tokens: 900
    # Groq's constrained decoding breaks on our schemas with this model (malformed
    # `"errors\": []`, then a `}]}]...` loop; 12/22 failed). Plain JSON mode: 6/6 fixed.
    json_mode: object
  # Phase 2 judge candidates, compared against `judge` on the human-graded corpora.
  # gpt-oss-120b is deliberately absent: it is the generator, so it can't judge.
  judge_candidate_qwen:
    provider: groq
    model: qwen/qwen3.8-27b
    family: qwen
    temperature: 0.0
    max_output_tokens: 900          # see verifier: 1,000 output tokens/min cap
    json_mode: object               # see verifier: constrained decoding breaks
  judge_candidate_local:
    provider: ollama
    model: qwen3:8b
    family: qwen
    temperature: 0.0
    max_output_tokens: 2048
    reasoning_effort: none
  feedback_phraser:
    provider: ollama
    model: qwen3:8b
    family: qwen
    temperature: 0.3
    max_output_tokens: 1024
    reasoning_effort: none          # Ollama: disables Qwen3 "thinking" (slow on a 6 GB GPU)
  perturber:
    provider: ollama
    model: qwen3:8b
    family: qwen
    temperature: 0.7
    max_output_tokens: 2048
    reasoning_effort: none

retry:
  max_attempts: 4          # total attempts for retryable errors (429, 5xx, timeouts)
  base_delay_s: 2.0
  max_delay_s: 60.0
